<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>عبود في ليوا</title>
<meta name="description" content="سفاري الكثبان: عبود يسوق سيارته في رمال ليوا بحرية، يطلع التلال ويجمع التمر. Abood in Liwa: a free-roam dune safari.">
<meta name="theme-color" content="#232a52">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="عبود في ليوا">
<meta property="og:title" content="عبود في ليوا · Abood in Liwa">
<meta property="og:description" content="Abood drives his dune car freely across the Liwa sands: climb the dunes, jump the crests, find the landmarks.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/baloo-bhaijaan-2-arabic-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/baloo-bhaijaan-2-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="modulepreload" href="js/game.js?v=__BUILD__">
<link rel="stylesheet" href="css/style.css?v=__BUILD__">
</head>
<body>
<canvas id="cv" data-i18n-aria="title" aria-label="عبود في ليوا"></canvas>

<div class="hud" id="hud" hidden>
  <div class="stat" id="distBox"><span id="mDist">0</span><small id="distLbl" data-i18n="m">م</small></div>
  <div class="chase" id="fuelBox"><svg class="fuel-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M4 21h12M7.5 7h5v4h-5zM15 9l3 2.5V17a1.5 1.5 0 0 0 3 0V9l-2.5-2.5"/></svg><div class="bar" id="bar" role="img" data-i18n-aria="fuel"><i id="fuelFill"></i></div></div>
  <div class="stat" id="dateBox"><span id="mDates">0</span><small id="dateLbl" data-i18n="dates">تمر</small></div>
</div>
<div id="mis" hidden></div>
<button id="miniBtn" type="button" data-i18n-aria="b_map" aria-label="الخريطة" hidden><canvas id="mini" width="264" height="264"></canvas></button>
<button id="driftBtn" type="button" hidden><span data-i18n="driftBtn">تفحيط</span></button>
<button class="corner" id="pauseBtn" data-i18n-aria="pause" aria-label="إيقاف مؤقت" hidden>II</button>
<button class="corner" id="mute" data-i18n-aria="sound" aria-label="الصوت والموسيقى" hidden>♪</button>

<div class="overlay" id="menu" hidden>
  <div class="panel menu">
    <div class="panel-top">
      <div class="pills"><div class="coinpill"><i class="coin" aria-hidden="true"></i><span class="coinVal">0</span></div><div class="coinpill lvp"><span class="lvVal"></span></div></div>
      <div class="tools">
        <button class="iconbtn" id="menuMute" type="button" data-i18n-aria="sound" aria-label="الصوت والموسيقى" aria-pressed="false"></button>
        <button class="iconbtn" id="fsBtn" type="button" data-i18n-aria="fullscreen" aria-label="ملء الشاشة" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <div class="lang" role="group" aria-label="Language / اللغة"></div>
      </div>
    </div>
    <div class="menu-main">
      <div class="avatar-box"><canvas id="avMenu" width="300" height="300" aria-hidden="true"></canvas><p class="av-tag"><b class="av-name" data-i18n="abood">عبود</b><span class="av-best" id="menuBest" hidden></span></p></div>
      <div class="menu-text">
        <p class="kicker" data-i18n="kicker"></p>
        <h1 data-i18n="title">عبود في ليوا</h1>
        <p class="story" data-i18n="story"></p>
        <button class="btn launch" id="startBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8h5M3 12h5M2 16h5M12 6l6 6-6 6M18 12h-7"/></svg><span data-i18n="start">يلا سفاري!</span></button>
        <div class="menu-grid">
          <button class="tile" type="button" data-sheet="missions"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l7-7M16 5h3v3"/></svg><span data-i18n="b_missions"></span></button>
          <button class="tile" type="button" data-sheet="races"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 5h13l-3 4 3 4H5"/></svg><span data-i18n="b_races"></span></button>
          <button class="tile" type="button" data-sheet="cards"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 4"/><circle cx="16" cy="9" r="1.4"/></svg><span data-i18n="b_cards"></span></button>
          <button class="tile" type="button" data-sheet="garage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15l1.5-5a2 2 0 0 1 2-1.5h9a2 2 0 0 1 2 1.5L20 15v3H4z"/><circle cx="8" cy="18" r="2"/><circle cx="16" cy="18" r="2"/></svg><span data-i18n="b_garage"></span></button>
          <button class="tile" type="button" data-sheet="map"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span data-i18n="b_map"></span></button>
          <button class="tile" type="button" data-sheet="help"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.2v.1"/></svg><span data-i18n="b_help"></span></button>
        </div>
        <p class="hint" id="iosHint" data-i18n="ios" hidden></p>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="panel over">
    <div class="panel-top"><p class="kicker" id="overQuote"></p><div class="pills"><div class="coinpill"><i class="coin" aria-hidden="true"></i><span class="coinVal">0</span></div><div class="coinpill lvp"><span class="lvVal"></span></div></div></div>
    <div class="menu-main">
      <div class="avatar-box"><canvas id="avOver" width="300" height="300" aria-hidden="true"></canvas><p class="av-tag"><b class="av-name" data-i18n="abood">عبود</b></p></div>
      <div class="menu-text">
        <h2 id="overTitle"></h2>
        <p id="overMsg"></p>
        <div class="score">
          <div><b id="sDist" dir="ltr">0</b><span data-i18n="sMetres"></span></div>
          <div><b id="sAir" dir="ltr">0</b><span data-i18n="sAir"></span></div>
          <div><b id="sBest" dir="ltr">0</b><span data-i18n="sBest"></span></div>
        </div>
        <div class="swap">
          <p class="label" data-i18n="o_swap"></p>
          <div class="swap-row">
            <div class="sw-box"><canvas id="swDateIc" width="64" height="64" aria-hidden="true"></canvas><b id="swDates" dir="ltr">0</b></div>
            <span class="sw-arrow" aria-hidden="true">➜</span>
            <div class="sw-box gold"><i class="coin" aria-hidden="true"></i><b id="swCoins" dir="ltr">0</b></div>
          </div>
          <div class="swap-parts"><span id="swPartS"></span><span id="swPartD"></span><span id="swPartA"></span></div>
        </div>
        <p class="route-line" id="overCards"></p>
        <div class="over-actions">
          <button class="btn" id="againBtn" type="button" data-i18n="again"></button>
          <button class="ghost" id="overMenuBtn" type="button" data-i18n="b_menu"></button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="pausePop" hidden>
  <div class="panel pick">
    <p class="pick-title" data-i18n="paused"></p>
    <div class="over-actions"><button class="btn" id="resumeBtn" type="button" data-i18n="resume"></button><button class="ghost" id="pauseMenuBtn" type="button" data-i18n="endRun"></button></div>
  </div>
</div>

<div class="overlay" id="sheet" hidden>
  <div class="panel sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-top"><h2 id="sheetTitle"></h2><div class="coinpill"><i class="coin" aria-hidden="true"></i><span class="coinVal">0</span></div><button class="ghost" id="sheetClose" type="button" data-i18n="b_close"></button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div id="note" role="status" aria-live="polite" hidden></div>

<div class="overlay" id="langPick" hidden>
  <div class="panel pick">
    <p class="pick-title" data-i18n="pickTitle">اختر اللغة</p>
    <div class="pick-row">
      <button type="button" class="pick-btn" data-pick="ar"><span class="flag-big" id="flagAr"></span><b lang="ar">العربية</b></button>
      <button type="button" class="pick-btn" data-pick="en"><span class="flag-big" id="flagEn"></span><b lang="en">English</b></button>
    </div>
    <p class="hint" data-i18n="pickHint"></p>
  </div>
</div>

<div id="toast" hidden><span data-i18n="update"></span><button type="button" id="toastBtn" data-i18n="updateBtn"></button></div>

<div id="loader" role="status" aria-live="polite">
  <div class="ld-card">
    <canvas id="ldCv" width="480" height="300" aria-hidden="true"></canvas>
    <p class="ld-title" data-i18n="title">عبود في ليوا</p>
    <div class="ld-bar"><i id="ldFill"></i></div>
    <p class="ld-text"><span id="ldMsg">جاري التحميل…</span> <b id="ldPct" dir="ltr">0%</b></p>
    <p class="ld-tip" id="ldTip"></p>
  </div>
</div>
<noscript><p style="position:fixed;inset:auto 0 40%;text-align:center;color:#fffaf0;font-size:18px">هذي اللعبة تحتاج JavaScript. This game needs JavaScript.</p></noscript>

<script type="module" src="js/game.js?v=__BUILD__"></script>
</body>
</html>
